# Local development dependencies for Level Zero.
#
#   pnpm infra:up      start Postgres + Redis
#   pnpm infra:down    stop them, keeping data
#   pnpm infra:reset   stop them and delete the volumes
#
# Values come from the repository root .env (see .env.example).

name: level-zero

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-level_zero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-level_zero}
      POSTGRES_DB: ${POSTGRES_DB:-level_zero}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-level_zero} -d ${POSTGRES_DB:-level_zero}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
