name: CI

on:
  # Lets CI be run on demand, which is the only way to check whether Actions is
  # working without pushing to main and risking a red X on the history.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://level_zero:level_zero@localhost:5432/level_zero
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: level_zero
          POSTGRES_PASSWORD: level_zero
          POSTGRES_DB: level_zero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U level_zero -d level_zero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build packages and apps
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
